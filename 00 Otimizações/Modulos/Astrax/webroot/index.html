        var GF_MS      = 'https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap';
        var GF_GS      = 'https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap';
        var IDB_NAME   = 'astrax-fonts-v3';
        var IDB_STORE  = 'f';
        var _injected  = {};

        function injectCSS(css, tag) {
            if (_injected[tag]) return;
            _injected[tag] = 1;
            var s = document.createElement('style');
            s.dataset.font = tag;
            s.textContent = css;
            document.head.appendChild(s);
        }

        function injectFontFace(family, url, fmt) {
            injectCSS(
                '@font-face{font-family:"' + family + '";src:url("' + url + '") format("' + fmt + '");font-display:swap;}',
                family + '-local'
            );
        }

        
        function idbOpen(cb) {
            try {
                var r = indexedDB.open(IDB_NAME, 1);
                r.onupgradeneeded = function(e){ e.target.result.createObjectStore(IDB_STORE); };
                r.onsuccess = function(e){ cb(null, e.target.result); };
                r.onerror   = function(){ cb(1); };
            } catch(e){ cb(1); }
        }
        function idbGet(db, k, cb) {
            try {
                var r = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);
                r.onsuccess = function(e){ cb(null, e.target.result); };
                r.onerror   = function(){ cb(1); };
            } catch(e){ cb(1); }
        }
        function idbPut(db, k, v) {
            try { db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v, k); } catch(e){}
        }

        
        function fetchInjectCache(db, url, tag, done) {
            fetch(url, {cache:'force-cache'}).then(function(r){
                return r.ok ? r.text() : Promise.reject(r.status);
            }).then(function(css){
                if (db) idbPut(db, tag, css);
                injectCSS(css, tag);
                if (done) done(true);
            }).catch(function(){ if (done) done(false); });
        }

        
        function loadOneFont(db, localFile, ksuPath, gfUrl, tag) {

            
            fetch(BASE + localFile, {cache: 'reload'}).then(function(r){
                if (!r.ok) throw new Error('no local file');
                return r.blob();
            }).then(function(blob){
                
                if (blob.size < 4096) throw new Error('local font file looks broken/truncated');
                var url = URL.createObjectURL(blob);
                var fmt = localFile.endsWith('.woff2') ? 'woff2' :
                          localFile.endsWith('.woff')  ? 'woff'  : 'truetype';
                injectFontFace(
                    tag === 'ms' ? 'Material Symbols Rounded' : 'Google Sans',
                    url, fmt
                );
            }).catch(function(){

                
                if (!db) { _layer3(db, ksuPath, gfUrl, tag); return; }
                idbGet(db, tag, function(err, cached){
                    if (!err && cached) {
                        injectCSS(cached, tag);
                    } else {
                        _layer3(db, ksuPath, gfUrl, tag);
                    }
                });
            });
        }

        function _layer3(db, ksuPath, gfUrl, tag) {
            
            fetchInjectCache(db, ksuPath, tag, function(ok){
                
                if (!ok) fetchInjectCache(db, gfUrl, tag, null);
            });
        }

        function init() {
            
            idbOpen(function(err, db){
                var d = err ? null : db;
                loadOneFont(d,
                    'GoogleSans-Regular.ttf',
                    KSU + 'google-sans.css',
                    GF_GS, 'gs'
                );
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else { init(); }
    })();
    </script>
