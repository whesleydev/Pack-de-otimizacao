<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Entrar — Trix</title>
<style>
:root{ --paper:#f3efe7; --ink:#1a1713; --muted:#6b655b; --line:rgba(120,110,95,.22); --line-strong:rgba(120,110,95,.34);
  --accent:#8d939e; --accent-ink:#fff; --danger:#bc332a; --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.34);
  --blur:saturate(150%) blur(18px); --ring:rgba(141,147,158,.35);
  --shadow:0 1px 2px rgba(25,22,18,.06),0 14px 34px -18px rgba(25,22,18,.35); --r:18px; --r-sm:11px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; }
@media (prefers-color-scheme: dark){ :root{ --paper:#0d0c0a; --ink:#f3efe7; --muted:#a49d90;
  --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.2); --accent:#c7ccd6; --accent-ink:#14161a;
  --danger:#ff6b5e; --glass:rgba(30,28,24,.5); --glass-2:rgba(30,28,24,.34);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 16px 40px -20px rgba(0,0,0,.8); } }
@keyframes otmRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes otmFade{from{opacity:0}to{opacity:1}}
@keyframes otmPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes otmShake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html::before{content:"";position:fixed;inset:0;z-index:-3;
  background:url('assets/wallpaper.jpeg') center/cover no-repeat}
body{ font-family:var(--font); color:var(--ink); line-height:1.55; min-height:100dvh;
  display:grid; place-items:center; padding:22px; overflow-x:clip;
  background:var(--paper); }
body::after{content:"";position:fixed;inset:0;z-index:-2;
  background:url('assets/wallpaper.jpeg') center/contain no-repeat}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--paper);opacity:.6}
.wrap{width:100%; max-width:380px; animation:otmRise .5s cubic-bezier(.2,.7,.3,1) both}
.brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; animation:otmFade .6s both}
.mark{width:56px; height:56px; border-radius:16px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:20px; box-shadow:var(--shadow); animation:otmPop .5s .1s both}
.brand h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em}
.brand p{margin:0; color:var(--muted); font-size:13px}
.card{ background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--shadow);
  animation:otmRise .5s .06s cubic-bezier(.2,.7,.3,1) both; }
label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:0 0 5px 3px}
.field{margin-bottom:14px}
input{ width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1px solid var(--line-strong);
  background:var(--glass-2); color:var(--ink); font-size:16px; font-weight:700;
  font-family:inherit; transition:border-color .15s, box-shadow .15s; }
input:focus-visible{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
.btn{ width:100%; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:var(--r-sm); padding:12px 16px; font-size:15px; font-weight:800; cursor:pointer; transition:transform .12s, filter .15s; }
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55; pointer-events:none}
.erro{ display:flex; gap:9px; align-items:flex-start; margin:0 0 14px; padding:11px 13px; font-size:13px;
  border:1px solid var(--danger); border-left-width:4px; border-radius:var(--r-sm); color:var(--ink);
  background:var(--glass-2); animation:otmShake .4s both; }
.erro b{color:var(--danger)}
.erro svg{width:16px;height:16px;flex:none;color:var(--danger);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.srv{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:14px;
  border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); text-align:center}
.srv a{display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--ink);
  border:1px solid var(--line-strong); background:var(--glass-2); border-radius:999px; padding:9px 15px;
  font-weight:700; font-size:12.5px; transition:.15s}
.srv a:hover{border-color:var(--accent); transform:translateY(-1px)}
.srv svg{width:16px;height:16px;fill:currentColor;flex:none}
.foot{margin-top:16px; text-align:center; font-size:11.5px; color:var(--muted); animation:otmFade .7s .2s both}
.foot b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true">TX</div>
    <h1>Trix</h1>
    <p>Entre para acessar o painel</p>
  </div>
  <form class="card" id="form" autocomplete="off">
    <div class="erro" id="erro" hidden role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v5"/><path d="M12 18h.01"/></svg>
      <div><b>Não deu para entrar.</b><br><span id="erroTxt"></span></div></div>
    <div class="field">
      <label for="user">Usuário</label>
      <input id="user" name="user" type="text" inputmode="text" spellcheck="false"
             autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <div class="field">
      <label for="pass">Senha</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" id="entrar" type="submit">Entrar</button>
    <div class="srv">
      <span>Dúvidas? Fale no</span>
      <a href="https://discord.gg/w9hFBeVKw8" target="_blank" rel="noopener" title="Servidor oficial do dono">
        <svg viewBox="0 0 127.14 96.36" aria-hidden="true"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        Servidor do dono
      </a>
    </div>
  </form>
  <div class="foot">Feito por <b>00deUdia</b> (WS) · a venda oficial é só no servidor do dono.</div>
</div>
<script>
/* Entrada por usuário/senha. A conferência é feita no nativo (hash embutido no
   aparelho), não aqui: o JS só mostra a resposta. Não há senha em texto no arquivo. */
const SESSION_FLAG = "otm_session";

const el = id => document.getElementById(id);

function showErro(msg){
  el("erroTxt").textContent = msg;
  el("erro").hidden = false;
  el("erro").style.animation = "none";
  void el("erro").offsetWidth;
  el("erro").style.animation = "";
}

/* Chama a ponte nativa e espera a resposta (mesmo protocolo do painel). */
function otmCall(kind, payload){
  return new Promise(resolve => {
    if (!window.OTM || !window.OTM.call) { resolve({ ok:false, message:"Este recurso só funciona no app." }); return; }
    const cbId = "k" + Date.now() + Math.random().toString(16).slice(2);
    window.__otmResolve = function(id, jsonStr){
      if (id !== cbId) return;
      let j = {}; try { j = JSON.parse(jsonStr); } catch(e){}
      resolve(j);
    };
    try { window.OTM.call(kind, payload || "", cbId); }
    catch(e){ resolve({ ok:false, message:String(e) }); }
  });
}

el("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const user = el("user").value.trim();
  const pass = el("pass").value;
  if (!user || !pass) { showErro("Preencha usuário e senha."); return; }
  await entrar(user, pass);
});

async function entrar(user, pass){
  el("erro").hidden = true;
  const btn = el("entrar"); btn.disabled = true; btn.textContent = "Verificando…";
  const r = await otmCall("app_login", JSON.stringify({ user, pass }));
  btn.disabled = false; btn.textContent = "Entrar";
  if (r && r.ok) {
    try { localStorage.setItem(SESSION_FLAG, "1"); localStorage.setItem("otm_user", r.user || user); } catch(e){}
    location.replace("index.html");
  } else {
    showErro((r && r.message) || "Usuário ou senha incorretos.");
  }
}

/* Já entrou antes: vai direto (o painel confirma a sessão com o nativo). */
try { if (localStorage.getItem(SESSION_FLAG)) location.replace("index.html"); } catch(e){}
</script>
</body>
</html>
