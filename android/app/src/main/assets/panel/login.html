<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Entrar — 00deUdia Otimizações</title>
<style>
:root{ --paper:#f3efe7; --ink:#1a1713; --muted:#6b655b; --line:rgba(120,110,95,.22); --line-strong:rgba(120,110,95,.34);
  --accent:#e4571c; --accent-ink:#fff; --danger:#bc332a; --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.34);
  --blur:saturate(150%) blur(18px); --ring:rgba(228,87,28,.35);
  --shadow:0 1px 2px rgba(25,22,18,.06),0 14px 34px -18px rgba(25,22,18,.35); --r:18px; --r-sm:11px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; }
@media (prefers-color-scheme: dark){ :root{ --paper:#0d0c0a; --ink:#f3efe7; --muted:#a49d90;
  --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.2); --accent:#ff6a2b; --accent-ink:#180d06;
  --danger:#ff6b5e; --glass:rgba(30,28,24,.5); --glass-2:rgba(30,28,24,.34);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 16px 40px -20px rgba(0,0,0,.8); } }
@keyframes otmRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes otmFade{from{opacity:0}to{opacity:1}}
@keyframes otmPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes otmShake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html::before{content:"";position:fixed;inset:0;z-index:-3;
  background:url('assets/wallpaper.jpeg') center/cover no-repeat}
body{ font-family:var(--font); color:var(--ink); line-height:1.55; min-height:100dvh;
  display:grid; place-items:center; padding:22px; overflow-x:clip;
  background:var(--paper); }
body::after{content:"";position:fixed;inset:0;z-index:-2;
  background:url('assets/wallpaper.jpeg') center/contain no-repeat}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--paper);opacity:.6}
.wrap{width:100%; max-width:380px; animation:otmRise .5s cubic-bezier(.2,.7,.3,1) both}
.brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; animation:otmFade .6s both}
.mark{width:56px; height:56px; border-radius:16px; display:grid; place-items:center;
  background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:20px; box-shadow:var(--shadow); animation:otmPop .5s .1s both}
.brand h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em}
.brand p{margin:0; color:var(--muted); font-size:13px}
.card{ background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--shadow);
  animation:otmRise .5s .06s cubic-bezier(.2,.7,.3,1) both; }
label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:0 0 5px 3px}
.field{margin-bottom:14px}
input{ width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1px solid var(--line-strong);
  background:var(--glass-2); color:var(--ink); font-size:15px; transition:border-color .15s, box-shadow .15s; }
input:focus-visible{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
.pw{position:relative}
.pw button{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:transparent;
  color:var(--muted); cursor:pointer; padding:8px; border-radius:8px; font-size:13px}
.btn{ width:100%; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:var(--r-sm); padding:12px 16px; font-size:15px; font-weight:800; cursor:pointer; transition:transform .12s, filter .15s; }
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.98)}
.erro{ display:flex; gap:9px; align-items:flex-start; margin:0 0 14px; padding:11px 13px; font-size:13px;
  border:1px solid var(--danger); border-left-width:4px; border-radius:var(--r-sm); color:var(--ink);
  background:var(--glass-2); animation:otmShake .4s both; }
.erro b{color:var(--danger)}
.hint{margin:14px 0 0; font-size:12px; color:var(--muted); text-align:center}
.foot{margin-top:16px; text-align:center; font-size:11.5px; color:var(--muted); animation:otmFade .7s .2s both}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true">00</div>
    <h1>00deUdia Otimizações</h1>
    <p>Entre para acessar o painel</p>
  </div>
  <form class="card" id="form" autocomplete="on">
    <div class="erro" id="erro" hidden role="alert"><span aria-hidden="true">⚠</span>
      <div><b>Não deu para entrar.</b><br><span id="erroTxt"></span></div></div>
    <div class="field">
      <label for="user">Usuário</label>
      <input id="user" name="user" type="text" inputmode="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="pass">Senha</label>
      <div class="pw">
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
        <button type="button" id="toggle" aria-label="Mostrar senha">ver</button>
      </div>
    </div>
    <button class="btn" id="entrar" type="submit">Entrar</button>
  </form>
  <div class="foot">Painel local — sem root, via Shizuku ou ADB por Wi-Fi.</div>
</div>
<script>
/* hash SHA-256 de "usuario:senha" — a senha não fica em texto no arquivo. */
const OTM_AUTH = "b6cddaaf9333c33071ae824248927b5349955fbb87167a5c1ddef5afa23d1a4d";
/* SHA-256 puro em JS: file:// nem sempre expõe crypto.subtle em WebViews antigas. */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow, mw=mp(2,32), i, j, result="", words=[], bits=ascii.length*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length, comp={};
  for(var cand=2; pc<64; cand++){
    if(!comp[cand]){
      for(i=0;i<313;i+=cand) comp[i]=cand;
      hash[pc]=(mp(cand,.5)*mw)|0; k[pc++]=(mp(cand,1/3)*mw)|0;
    }
  }
  ascii+="\x80";
  while(ascii.length%64-56) ascii+="\x00";
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bits/mw)|0); words[words.length]=bits;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:"")+b.toString(16); }
  return result;
}
document.getElementById("toggle").onclick = (e) => {
  const p = document.getElementById("pass"), on = p.type === "password";
  p.type = on ? "text" : "password";
  e.currentTarget.textContent = on ? "ocultar" : "ver";
  e.currentTarget.setAttribute("aria-label", on ? "Ocultar senha" : "Mostrar senha");
};
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value;
  if (sha256(u + ":" + p) === OTM_AUTH) {
    localStorage.setItem("otm_session", OTM_AUTH);
    location.replace("index.html");
  } else {
    document.getElementById("erroTxt").textContent = "Usuário ou senha incorretos.";
    document.getElementById("erro").hidden = false;
  }
});
/* se já entrou, vai direto */
if (localStorage.getItem("otm_session") === OTM_AUTH) location.replace("index.html");
</script>
</body>
</html>
