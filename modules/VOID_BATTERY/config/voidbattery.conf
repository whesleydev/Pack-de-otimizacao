# VOID BATTERY v9.1 — Configuration
# ═══════════════════════════════════════

# Battery thresholds
VB_LOW=20
VB_HIGH=80
VB_CRIT=10

# Timing (seconds)
VB_INTERVAL=300           # Core functions (5 min)
VB_HEAVY_INTERVAL=1800    # Heavy functions (30 min)
VB_REPORT_INTERVAL=3600   # Reports (60 min)

# Protection
VB_PUSH_PROTECT=true      # Protect messaging apps

# Data Saver is user-controlled by default. Use "manual" to never change it.
# Legacy values smart/always/off are accepted only when VB_MANAGE_DATA_SAVER=true.
VB_DATA_SAVER=manual
VB_MANAGE_DATA_SAVER=false

# Android/OEM policy controls. Disabled by default because OriginOS and other OEMs
# already manage these policies and may re-apply or conflict with shell writes.
VB_MANAGE_DOZE=false
VB_MANAGE_STANDBY=false
VB_MANAGE_BACKGROUND_DATA=false
VB_MANAGE_GMS=false
VB_ALLOW_AGGRESSIVE_CRITICAL=false
VB_SKIP_WHEN_SCREEN_OFF=true
VB_SCREEN_OFF_INTERVAL=1800  # 30 min; no optimization cycle while screen is off

# Bloatware: 0=off, 1=disable vendor bloat
VB_BLOAT=0

# Debug: 1=log without applying
VB_DRY_RUN=0
