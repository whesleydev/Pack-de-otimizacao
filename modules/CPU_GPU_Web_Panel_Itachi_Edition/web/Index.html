<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU & GPU Web Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        .author {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .card {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .card h2 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .status {
            font-size: 0.9rem;
            color: #4ade80;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CPU & GPU Panel</h1>
        <div class="author">Itachi Edition</div>

        <div class="card">
            <h2>Estado del Sistema</h2>
            <p class="status" id="status-text">Listo para optimizar</p>
        </div>

        <button onclick="ejecutarAccion()">Optimizar Ahora</button>
    </div>

    <script>
        function ejecutarAccion() {
            const status = document.getElementById('status-text');
            status.innerText = "Ejecutando...";
            
            // Integración nativa con la API de AxManager para ejecutar el action.sh o run.sh
            if (typeof exec === 'function') {
                exec('sh /data/adb/modules/cpu_gpu_webui_jhonzxit/run.sh', function(output) {
                    status.innerText = "¡Optimización completada!";
                });
            } else {
                setTimeout(() => {
                    status.innerText = "¡Proceso simulado con éxito!";
                }, 1000);
            }
        }
    </script>

</body>
</html>
